services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    env_file: [{path: .env, required: false}]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: [{path: .env, required: false}]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
    depends_on:
      db: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_TARGET: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
